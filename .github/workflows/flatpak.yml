name: Flatpak (Linux)

# Builds Funnel as a Flatpak and publishes a self-hosted OSTree repo to GitHub
# Pages at https://notmicrosoft2000-cmd.github.io/gnu-sorter/flatpak/.
#
# The site itself is served from docs/ on main, so the flatpak repo is written
# to docs/flatpak/ and committed back. It runs when a `v*` tag is pushed (the
# tag is pushed by a user/CLI, so unlike a GITHUB_TOKEN-created release it does
# fire workflows), when a release is published, or manually from the Actions
# tab.
#
# Optional signing: add a repository GPG key as the secrets
# FLATPAK_GPG_PRIVATE_KEY (ASCII-armoured) and FLATPAK_GPG_KEY_ID. Without them
# the repo is published unsigned and clients must add it with
# `flatpak remote-add --no-gpg-verify ...` (see PACKAGING.md).

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Build the Flatpak into an OSTree repo
        run: |
          rm -rf docs/flatpak
          flatpak-builder --user --repo=docs/flatpak --force-clean \
            --disable-rofiles-fuse \
            build-dir packaging/flatpak/io.neptunepc.Funnel.yml

      - name: Sign + update the repo (if a key is configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import -
            flatpak build-update-repo \
              --gpg-sign="$GPG_KEY_ID" \
              --gpg-homedir="$GNUPGHOME" \
              docs/flatpak
            echo "signed=yes" >> "$GITHUB_ENV"
          else
            flatpak build-update-repo docs/flatpak
            echo "signed=no" >> "$GITHUB_ENV"
          fi

      - name: Write .flatpakrepo + landing page
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          BASE=https://notmicrosoft2000-cmd.github.io/gnu-sorter/flatpak
          {
            echo "[Flatpak Repo]"
            echo "Title=Funnel"
            echo "Url=$BASE/"
            echo "Homepage=https://notmicrosoft2000-cmd.github.io/gnu-sorter/"
            echo "Comment=Sort any folder automatically with your own rules"
            echo "Icon=$BASE/gnu-sorter.png"
            if [ "$signed" = "yes" ]; then
              echo "GPGKey=$(gpg --export "$GPG_KEY_ID" | base64 -w0)"
            fi
          } > docs/flatpak/io.neptunepc.Funnel.flatpakrepo
          cp data/icons/gnu-sorter.png docs/flatpak/gnu-sorter.png
          cp data/icons/gnu-sorter.svg docs/flatpak/gnu-sorter.svg
          cat > docs/flatpak/index.html <<'HTML'
          <!doctype html>
          <html lang="en" data-theme="dark">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Funnel Flatpak repository</title>
            <meta name="description" content="The Flatpak repository for Funnel. Add the remote, install io.neptunepc.Funnel, and start the app.">
            <meta name="theme-color" content="#12110f">
            <link rel="icon" href="../favicon.ico">
            <link rel="stylesheet" href="../style.css">
            <script>
              // Apply the saved theme before paint to avoid a flash.
              (function () {
                try {
                  var stored = localStorage.getItem('gs-theme');
                  if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                  } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
                    document.documentElement.setAttribute('data-theme', 'light');
                  }
                } catch (e) { /* ignore */ }
              })();
            </script>
          </head>
          <body>
            <main id="main" class="wrap">
              <section class="page-hero">
                <h1>Funnel Flatpak repository.</h1>
                <p class="sec-lede">This directory is the OSTree repository and the source of <code>io.neptunepc.Funnel.flatpakrepo</code> for the Funnel Flatpak build. The three commands below add the remote, install the app, and start it.</p>

                <div class="code">
                  <div class="code-head">
                    <span class="code-label">Install and run</span>
                    <button class="copy-btn" type="button" data-copy="flatpak remote-add --if-not-exists funnel https://notmicrosoft2000-cmd.github.io/gnu-sorter/flatpak/io.neptunepc.Funnel.flatpakrepo
          flatpak install funnel io.neptunepc.Funnel
          flatpak run io.neptunepc.Funnel" aria-label="Copy the Flatpak install commands">Copy</button>
                  </div>
                  <pre><code>flatpak remote-add --if-not-exists funnel https://notmicrosoft2000-cmd.github.io/gnu-sorter/flatpak/io.neptunepc.Funnel.flatpakrepo
          flatpak install funnel io.neptunepc.Funnel
          flatpak run io.neptunepc.Funnel</code></pre>
                </div>

                <p class="fineprint">The sandbox build has no tray icon and no login autostart. <a href="../index.html">Funnel site</a> &middot; <a href="../download.html">Download and requirements</a> &middot; <a href="https://github.com/notmicrosoft2000-cmd/gnu-sorter" target="_blank" rel="noopener">Source on GitHub</a></p>
              </section>
            </main>

            <script src="../script.js"></script>
          </body>
          </html>
          HTML

      - name: Commit the repo back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The build runs on the released tag, i.e. a detached HEAD, so carry
          # the generated repository over to main and commit it there.
          rm -rf /tmp/flatpak-out
          cp -r docs/flatpak /tmp/flatpak-out
          git fetch origin main
          git checkout -B main origin/main
          rm -rf docs/flatpak
          cp -r /tmp/flatpak-out docs/flatpak
          git add docs/flatpak
          if git diff --cached --quiet; then
            echo "No repository changes to publish."
          else
            git commit -m "Publish Flatpak repository ${GITHUB_REF_NAME}"
            git push origin main
          fi
