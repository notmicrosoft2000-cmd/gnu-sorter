name: Release (Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Byte-compile
        run: python -m compileall -q gnu_sorter main.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Determine channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*|*-indev*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                               echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.channel.outputs.tag }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
          files: |
            install.sh
            install-gnu-sorter.sh
            main.py