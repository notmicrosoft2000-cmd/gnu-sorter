# Flatpak manifest for Funnel (Linux codename: gnu-sorter).
#
# Build locally (flatpak-builder must be installed):
#   flatpak-builder --user --install --force-clean \
#     --install-deps-from=flathub \
#     build-dir packaging/flatpak/io.neptunepc.Funnel.yml
#   flatpak run io.neptunepc.Funnel
#
# Build a signed-but-local OSTree repo (what the Pages mirror hosts):
#   flatpak-builder --repo=repo --force-clean build-dir \
#     packaging/flatpak/io.neptunepc.Funnel.yml
#   flatpak build-update-repo repo
#
# The GNOME runtime ships python3 + PyGObject + GTK4/libadwaita, so this is a
# pure "copy the source" module — no compilation and no pip at build time.
app-id: io.neptunepc.Funnel
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: gnu-sorter

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # A file sorter needs to reach the folders it tidies.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  # Desktop notifications + a best-effort StatusNotifier tray icon.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.indicator.application
  - --own-name=io.neptunepc.Funnel

modules:
  - name: funnel
    buildsystem: simple
    build-commands:
      - install -Dm755 packaging/flatpak/funnel-launcher.sh /app/bin/gnu-sorter
      - mkdir -p /app/share/gnu-sorter
      - cp -r gnu_sorter main.py /app/share/gnu-sorter/
      # Desktop entry, AppStream metadata and icon, renamed to the app id —
      # this is what Flathub / the OSTree repo expect.
      - install -Dm644 data/gnu-sorter.desktop /app/share/applications/io.neptunepc.Funnel.desktop
      - sed -i 's|^Icon=gnu-sorter$|Icon=io.neptunepc.Funnel|' /app/share/applications/io.neptunepc.Funnel.desktop
      - install -Dm644 data/io.neptunepc.Funnel.metainfo.xml /app/share/metainfo/io.neptunepc.Funnel.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/gnu-sorter.svg /app/share/icons/hicolor/scalable/apps/io.neptunepc.Funnel.svg
      - install -Dm644 data/icons/hicolor/scalable/apps/gnu-sorter.svg /app/share/icons/hicolor/scalable/apps/gnu-sorter.svg
      - |
        for s in 16 22 24 32 48 64 128 256 512; do
          install -Dm644 "data/icons/hicolor/${s}x${s}/apps/gnu-sorter.png" \
            "/app/share/icons/hicolor/${s}x${s}/apps/io.neptunepc.Funnel.png"
          install -Dm644 "data/icons/hicolor/${s}x${s}/apps/gnu-sorter.png" \
            "/app/share/icons/hicolor/${s}x${s}/apps/gnu-sorter.png"
        done
    sources:
      - type: dir
        path: ../..
