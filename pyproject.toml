[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnu-sorter"
dynamic = ["version"]
description = "GTK4/libadwaita app that sorts any folder(s) with user-defined rules."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [
  {name = "notmicrosoft2000-cmd", email = "notmicrosoft2000-cmd@users.noreply.github.com"}
]
dependencies = [
  "platformdirs",
  "watchdog",
  "pystray",
]

[project.optional-dependencies]
tray = ["pystray"]

[project.scripts]
gnu-sorter = "gnu_sorter.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gnu_sorter.__version__"}

[tool.setuptools.packages.find]
include = ["gnu_sorter*"]
exclude = ["tests*"]
